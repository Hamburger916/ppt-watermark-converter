<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#081225" />
    <meta name="description" content="在浏览器本地为 PDF 添加自定义文字水印，支持透明度、字号、角度与平铺方式。" />
    <title>PDF 水印工具</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23081427'/%3E%3Cpath d='M19 12h19l10 10v30H19z' fill='%23eaf2ff'/%3E%3Cpath d='M38 12v10h10' fill='none' stroke='%23689cff' stroke-width='4'/%3E%3Cpath d='m24 41 17-10' stroke='%235c87ff' stroke-width='5' stroke-linecap='round' opacity='.7'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="noise" aria-hidden="true"></div>

    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="PDF 水印工具首页">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7 3.5h7l4 4V20H7z"/><path d="M14 3.5v4h4M9.3 15.5l5.8-3.4"/></svg>
          </span>
          <span>PDF 水印工具</span>
        </a>
        <div class="privacy-pill">
          <span class="pulse-dot" aria-hidden="true"></span>
          文件仅在本机处理
        </div>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">PRIVATE · FAST · SIMPLE</p>
          <h1 id="page-title">给 PDF 加上<br /><span>你的专属水印</span></h1>
        </div>
        <p class="intro-copy">无需上传服务器。选择 PDF、调整样式，几秒钟生成带水印的新文件。</p>
      </section>

      <section class="workspace">
        <div class="glass-card control-card">
          <div class="section-heading">
            <span class="step-number">01</span>
            <div>
              <h2>选择 PDF</h2>
              <p>支持拖拽或点击选择</p>
            </div>
          </div>

          <input id="file-input" class="visually-hidden" type="file" accept="application/pdf,.pdf" />
          <label id="drop-zone" class="drop-zone" for="file-input" tabindex="0">
            <span class="upload-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 16V5m0 0L8 9m4-4 4 4M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>
            </span>
            <span class="drop-title">把 PDF 拖到这里</span>
            <span class="drop-hint">或点击浏览文件</span>
          </label>

          <div id="file-card" class="file-card" hidden>
            <span class="pdf-badge">PDF</span>
            <span class="file-info">
              <strong id="file-name"></strong>
              <small id="file-meta"></small>
            </span>
            <button id="remove-file" class="icon-button" type="button" aria-label="移除文件">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
            </button>
          </div>

          <div class="divider"></div>

          <div class="section-heading settings-heading">
            <span class="step-number">02</span>
            <div>
              <h2>设置水印</h2>
              <p>预览会随设置实时更新</p>
            </div>
          </div>

          <div class="field full-field">
            <label for="watermark-text">水印文字</label>
            <div class="text-input-wrap">
              <input id="watermark-text" type="text" maxlength="80" value="仅供内部使用" placeholder="请输入水印文字" />
              <span id="char-count">6 / 80</span>
            </div>
          </div>

          <div class="mode-switch" role="radiogroup" aria-label="水印排列方式">
            <button class="mode-option is-active" type="button" role="radio" aria-checked="true" data-mode="tile">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
              重复平铺
            </button>
            <button class="mode-option" type="button" role="radio" aria-checked="false" data-mode="single">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="m8.5 15 7-5"/></svg>
              单个居中
            </button>
          </div>

          <div class="slider-grid">
            <div class="field">
              <div class="label-row"><label for="opacity">透明度</label><output id="opacity-value">18%</output></div>
              <input id="opacity" type="range" min="5" max="80" value="18" />
            </div>
            <div class="field">
              <div class="label-row"><label for="font-size">字号</label><output id="font-size-value">42 pt</output></div>
              <input id="font-size" type="range" min="16" max="96" value="42" />
            </div>
            <div class="field">
              <div class="label-row"><label for="rotation">旋转角度</label><output id="rotation-value">−30°</output></div>
              <input id="rotation" type="range" min="-90" max="90" value="-30" />
            </div>
            <div class="field" id="spacing-field">
              <div class="label-row"><label for="spacing">平铺间距</label><output id="spacing-value">140 pt</output></div>
              <input id="spacing" type="range" min="60" max="260" value="140" />
            </div>
          </div>

          <p id="error-message" class="message error-message" role="alert" hidden></p>
          <button id="process-button" class="primary-button" type="button" disabled>
            <span class="button-label">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h7l4 4V20H7zM14 3.5v4h4M9.5 14l2 2 3.5-4"/></svg>
              生成带水印的 PDF
            </span>
            <span class="button-loading" hidden><span class="spinner" aria-hidden="true"></span>正在处理…</span>
          </button>
        </div>

        <aside class="glass-card preview-card" aria-labelledby="preview-title">
          <div class="preview-header">
            <div>
              <p class="preview-kicker">LIVE PREVIEW</p>
              <h2 id="preview-title">实时预览</h2>
            </div>
            <span id="mode-label" class="preview-mode">重复平铺</span>
          </div>

          <div class="preview-stage">
            <div class="document-sheet" aria-hidden="true">
              <div class="doc-header"><span></span><span></span></div>
              <div class="doc-title"></div>
              <div class="doc-line long"></div>
              <div class="doc-line"></div>
              <div class="doc-line medium"></div>
              <div class="doc-blocks"><i></i><i></i><i></i></div>
              <div id="watermark-preview" class="watermark-layer tile-mode"></div>
            </div>
            <span class="page-chip">第 1 页示意</span>
          </div>

          <div class="security-note">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5.5 6v5.2c0 4.2 2.7 7.8 6.5 9.8 3.8-2 6.5-5.6 6.5-9.8V6z"/><path d="m9.2 12 1.8 1.8 3.8-4"/></svg>
            <div><strong>本地处理，更安心</strong><span>文件不会离开你的设备，也不会被保存。</span></div>
          </div>

          <div id="success-panel" class="success-panel" hidden>
            <span class="success-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m6.5 12.5 3.5 3.5 7.5-8"/></svg></span>
            <div><strong>处理完成</strong><span id="output-meta">新的 PDF 已准备好</span></div>
            <button id="download-button" type="button">下载 PDF</button>
          </div>
        </aside>
      </section>

      <footer><span>无需安装 · 无需注册 · 免费使用</span><span>PDF WATERMARK · LOCAL EDITION</span></footer>
    </main>

    <script src="vendor/pdf-lib.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
