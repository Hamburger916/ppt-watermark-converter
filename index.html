<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="在浏览器中将 PPTX 转换为带自定义水印的 PDF" />
  <title>PPT 水印转换器</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232563eb'/%3E%3Cpath d='M9 7h10l5 5v13H9z' fill='white'/%3E%3Cpath d='M12 17h9M12 21h7' stroke='%232563eb' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <script type="module" crossorigin src="/assets/index-DoLpihle.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-KtzyMPmc.css">
</head>
<body>
  <header>
    <div class="bar">
      <div class="brand"><span class="logo">✦</span><div><b>PPT 水印转换器</b><small>本地处理 · 文件不会上传</small></div></div>
      <span class="privacy">🔒 文件仅在你的浏览器中处理</span>
    </div>
  </header>
  <main>
    <section class="work">
      <div class="card">
        <div class="step">第一步</div><h1>上传 PowerPoint</h1>
        <input id="file" type="file" accept=".pptx" hidden />
        <button id="drop" class="drop"><span class="upload">⇧</span><strong>点击选择或拖入 PPTX 文件</strong><span id="fileMeta">支持 .pptx，单个文件最大 80MB</span></button>
      </div>
      <div class="card">
        <div class="step">第二步</div><h2>自定义水印</h2>
        <label>水印文字</label><input id="text" value="仅供预览" maxlength="40" />
        <div class="grid">
          <div><label>排列方式</label><div class="modes"><button data-mode="center">居中</button><button data-mode="diagonal">斜向</button><button data-mode="tile" class="active">平铺</button></div></div>
          <div><label>颜色</label><div class="color"><input id="color" type="color" value="#2563eb" /><span id="colorValue">#2563EB</span></div></div>
          <div class="setting"><div><label>透明度</label><span id="opacityValue">16%</span></div><input id="opacity" type="range" min="5" max="60" value="16" /></div>
          <div class="setting"><div><label>字号</label><span id="sizeValue">38px</span></div><input id="size" type="range" min="20" max="80" value="38" /></div>
          <div class="setting wide"><div><label>旋转角度</label><span id="angleValue">-28°</span></div><input id="angle" type="range" min="-60" max="60" value="-28" /></div>
        </div>
      </div>
    </section>
    <aside>
      <div class="preview-card"><div class="preview-top"><span>效果预览</span><span>第 1 页</span></div><div id="preview" class="preview"><span class="mock-title"></span><span class="mock-line"></span></div><div id="progressWrap" class="progress-wrap" hidden><div><span>正在转换</span><span id="progressText">0%</span></div><progress id="progress" max="100" value="0"></progress></div><button id="convert" class="convert" disabled>⇩ 一键转换并下载 PDF</button><p>复杂动画、视频和少数特殊字体可能会被简化；转换结果以静态页面呈现。</p></div>
      <div class="chips"><span>本地转换</span><span>自定义水印</span><span>直接下载</span></div>
    </aside>
  </main>
  <div id="toast" role="status"></div>
</body>
</html>
